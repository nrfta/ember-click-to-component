name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Also builds the addon (root `prepare` script).
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Addon unit tests
        run: pnpm --filter ember-click-to-component test
      - name: Test-app QUnit tests
        run: pnpm --filter test-app test
      - name: Production bundle check
        run: pnpm --filter test-app check:prod
